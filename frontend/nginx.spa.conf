# Servidor de archivos estáticos de la SPA (imagen `prod` del frontend).
# El nginx público (nginx/nginx.conf) termina TLS, pone los encabezados de
# seguridad y reenvía aquí; este sólo sirve /usr/share/nginx/html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Los archivos con hash de Vite son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del cliente devuelve index.html (sin caché, para que
    # un despliegue nuevo se vea al recargar).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
