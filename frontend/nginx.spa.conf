# Servidor de archivos estáticos de la SPA (imagen `prod` del frontend).
# El nginx público (nginx/nginx.conf) termina TLS, pone los encabezados de
# seguridad y reenvía aquí; este sólo sirve /usr/share/nginx/html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Los archivos con hash de Vite son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Medios del landing (public/landing/). Un archivo que falta es 404 y no index.html: con el try_files de la SPA
    # respondería HTML con 200, y el <img>/<video> fallaría igual pero por la razón equivocada. El landing muestra su
    # hueco en los dos casos. Una hora de caché: los archivos se reemplazan con el mismo nombre (docs/landing.md).
    location /landing/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del cliente devuelve index.html (sin caché, para que
    # un despliegue nuevo se vea al recargar).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
