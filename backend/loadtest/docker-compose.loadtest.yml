# Override SOLO para las pruebas de carga del Sprint 8 (no toca docker-compose.yml).
# Relaja los limitadores por IP que, con una sola IP de Artillery, ocultarían la capacidad
# real de los endpoints nuevos (activar 10/15min, heartbeat 60/15min, general 1000/15min).
# Uso:
#   JWT_SECRET=$(docker exec securegate-backend printenv JWT_SECRET) \
#     docker compose -f docker-compose.yml -f backend/loadtest/docker-compose.loadtest.yml up -d backend
# Al terminar, volver a los límites de producción:  backend/securitytest/stack.sh prod-limits
services:
  backend:
    environment:
      RATE_LIMIT_GENERAL_MAX: "100000"
      RATE_LIMIT_LOGIN_MAX: "100000"
      RATE_LIMIT_ACTIVAR_MAX: "100000"
      RATE_LIMIT_HEARTBEAT_MAX: "100000"
      RATE_LIMIT_SESION_MAX: "100000"
      DB_POOL_MAX: "${DB_POOL_MAX:-20}"
