version: '3.9'

services:

  db:
    image: postgres:15-alpine
    container_name: securegate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securegate
      POSTGRES_USER: sguser
      POSTGRES_PASSWORD: sgpassword123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - securegate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sguser -d securegate"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securegate-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://sguser:sgpassword123@db:5432/securegate
      JWT_SECRET: securegate_jwt_secret_dev
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    networks:
      - securegate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securegate-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - securegate-network

  nginx:
    image: nginx:alpine
    container_name: securegate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - securegate-network

volumes:
  postgres_data:
    driver: local

networks:
  securegate-network:
    driver: bridge
