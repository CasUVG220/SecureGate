# Compose de uso diario: local y VMs de desarrollo/staging.
# Backend y frontend exponen sus puertos directamente, sin nginx ni
# certificados SSL. Para el despliegue con dominio real + Let's Encrypt
# usa docker-compose.prod.yml (ver README).

services:

  db:
    image: postgres:15-alpine
    container_name: securegate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securegate
      POSTGRES_USER: sguser
      # Sólo desarrollo. Cámbiala en .env si esta base queda accesible desde fuera.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgpassword123}
    ports:
      # Sólo el propio equipo: antes escuchaba en 0.0.0.0 con una contraseña
      # publicada en el repositorio, o sea, abierta a toda la red de la VM.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - securegate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sguser -d securegate"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: securegate-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      # Cuentas demo (admin@securegate.com …) y pago con tarjeta simulado: SÓLO
      # en este compose de desarrollo. El de producción no los define, y el
      # backend en producción desactiva las cuentas demo y responde 501 al pago.
      SEED_DEMO: "true"
      PAGOS_TARJETA_SIMULADA: "true"

      # Por defecto apunta al Postgres local del compose (servicio `db`). Para
      # trabajar contra Cloud SQL (Sprint 8) exporta DATABASE_URL en el shell
      # antes de `docker compose up` (ver scripts/migrate-to-cloudsql.sh); el
      # servicio `db` sigue levantándose pero el backend no lo usa.
      DATABASE_URL: "${DATABASE_URL:-postgresql://sguser:${POSTGRES_PASSWORD:-sgpassword123}@db:5432/securegate}"
      # Tamaño del pool de pg. 20 va bien con el Postgres local (max_connections
      # 100); contra Cloud SQL db-f1-micro (25 conexiones) bájalo a 10.
      DB_POOL_MAX: "${DB_POOL_MAX:-20}"
      # Sin valor por defecto a propósito: el que estaba aquí era público (vivía en
      # el repositorio) y con él cualquiera fabricaba un token de owner. Si no lo
      # defines en .env, el backend genera uno aleatorio en cada arranque (las
      # sesiones y licencias de garita se invalidan al reiniciar). deploy.sh
      # crea uno persistente la primera vez.
      JWT_SECRET: ${JWT_SECRET:-}
      # Opcional. Vacío: en desarrollo el CORS refleja el origen del navegador.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      TZ: America/Guatemala
      APP_TZ: America/Guatemala
      # Overrides sólo para pruebas de carga (ver backend/loadtest/). Sin
      # exportar estas vars en el shell antes de "docker compose up", quedan
      # en los mismos límites de producción (1000 / 10).
      RATE_LIMIT_GENERAL_MAX: "${RATE_LIMIT_GENERAL_MAX:-1000}"
      RATE_LIMIT_LOGIN_MAX: "${RATE_LIMIT_LOGIN_MAX:-10}"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./database/init.sql:/app/database/init.sql:ro
      - ./database/seed-dev.sql:/app/database/seed-dev.sql:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - securegate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: securegate-frontend
    restart: unless-stopped
    environment:
      # Valor por defecto para uso local. Al abrir el frontend desde otra
      # maquina (IP de una VM), services/api.ts detecta el hostname en
      # runtime y apunta al backend de ese mismo host, asi que no hace falta
      # editar esta variable por servidor.
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - securegate-network

volumes:
  postgres_data:
    driver: local

networks:
  securegate-network:
    driver: bridge
