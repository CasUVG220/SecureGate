# Compose de PRODUCCION — solo para servidores con dominio real y
# certificados de Let's Encrypt ya emitidos en /etc/letsencrypt.
#
# NO usar en local ni en VMs sin dominio: nginx entra en crash-loop si los
# certificados no existen. Para el dia a dia usa docker-compose.yml.
#
# Antes de levantarlo:
#   1. Apuntar el dominio (registro A) a la IP publica del servidor.
#   2. Emitir el certificado, p. ej.:
#        sudo certbot certonly --standalone -d midominio.com
#   3. Definir DOMINIO (o PUBLIC_URL) en el entorno o en .env. nginx/nginx.conf NO se
#      edita a mano: se genera desde nginx/nginx.conf.template con
#      scripts/render-nginx.sh, que falla si el dominio falta o es inválido.
#   4. Exportar las variables del bloque `environment` (o crear un .env).
#
# Uso (recomendado: ./scripts/deploy.sh, que valida y genera nginx antes de levantar):
#   ./scripts/render-nginx.sh && docker compose -f docker-compose.prod.yml up --build -d

services:

  # ── Base de datos ──────────────────────────────────────────────────────────
  # Desde Sprint 8 la base de producción vive en Cloud SQL y el backend llega
  # a ella por el Cloud SQL Auth Proxy (abajo). El Postgres en contenedor se
  # conserva bajo el perfil `local-db` para entornos sin Cloud SQL:
  #   docker compose -f docker-compose.prod.yml --profile local-db up -d
  # y en ese caso DATABASE_URL debe apuntar a db:5432.
  db:
    image: postgres:15-alpine
    container_name: securegate-db
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securegate}
      POSTGRES_USER: ${POSTGRES_USER:-sguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - securegate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sguser} -d ${POSTGRES_DB:-securegate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: securegate-backend
    restart: unless-stopped
    # Endurecimiento del contenedor: sin capacidades de Linux extra y sin poder
    # escalar privilegios (el proceso ya corre como el usuario `node`, no root).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      # Un salto de proxy (nginx): req.ip toma la IP real del cliente para el
      # rate limit y la auditoría, y X-Forwarded-For del cliente ya no se cree.
      TRUST_PROXY: "1"
      # Clave de Google Vision (OCR de respaldo). Opcional.
      GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
      # OJO: aquí NO se define PAGOS_TARJETA_SIMULADA ni SEED_DEMO, y no deben
      # definirse: la pasarela de tarjeta es un mock que liquida deudas.
      # Cloud SQL vía el proxy: postgresql://USUARIO:PASSWORD@cloud-sql-proxy:5432/securegate
      # (con --profile local-db: postgresql://USUARIO:PASSWORD@db:5432/securegate)
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL (ver scripts/migrate-to-cloudsql.sh)}
      # db-f1-micro admite 25 conexiones; db-g1-small 50. Ajusta con la instancia.
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # ≥ 32 caracteres y no público: si no, el backend se niega a arrancar.
      # Genera uno con `openssl rand -hex 48`.
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el entorno}
      # Origenes permitidos por CORS. En produccion es obligatorio: el
      # backend no refleja el origen del navegador fuera de desarrollo.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?define ALLOWED_ORIGINS, p. ej. https://midominio.com}
      TZ: America/Guatemala
      APP_TZ: America/Guatemala
    volumes:
      - ./database/init.sql:/app/database/init.sql:ro
    depends_on:
      - cloud-sql-proxy
    networks:
      - securegate-network

  # Túnel autenticado hacia Cloud SQL: cifra la conexión y autentica con IAM,
  # así la instancia no necesita IP pública abierta ni "redes autorizadas".
  # En la VM de GCP usa la service account adjunta (necesita el rol
  # roles/cloudsql.client); fuera de GCP monta un JSON de SA y añade
  # `--credentials-file /secrets/sa.json`.
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4
    container_name: securegate-cloud-sql-proxy
    restart: unless-stopped
    command:
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME:?define CLOUD_SQL_CONNECTION_NAME, p. ej. securegate-503823:us-central1:securegate-pg}"
    networks:
      - securegate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        # Detras de nginx el frontend y la API comparten dominio, asi que la
        # URL base es el propio origen HTTPS. Se hornea en el build.
        VITE_API_URL: ${PUBLIC_URL:?define PUBLIC_URL, p. ej. https://midominio.com}
    container_name: securegate-frontend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    networks:
      - securegate-network

  nginx:
    image: nginx:alpine
    container_name: securegate-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    volumes:
      # Generado por scripts/render-nginx.sh (deploy.sh lo corre). Si no existe, Compose
      # aborta en vez de crear un directorio vacío y dejar a nginx en crash-loop.
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - securegate-network

volumes:
  postgres_data:
    driver: local

networks:
  securegate-network:
    driver: bridge
